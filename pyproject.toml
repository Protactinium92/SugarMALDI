[project]
name = "sugarmaldi"
version = "0.1.7"
description =  "SugarMALDI is an open-source computational framework for the analysis of MALDI mass spectrometry data, dedicated to carbohydrate and glycan characterization. It integrates spectral preprocessing, adduct-aware composition inference, and visualization tools to support high-throughput studies in glycomics."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "isospecpy>=2.3.5",
    "joblib>=1.5.3",
    "matplotlib>=3.10.6",
    "numpy>=2.3.2",
    "plotly>=6.3.0",
    "polars>=1.33.0",
    "pytest>=9.1.1",
    "scipy>=1.16.1",
    "streamlit>=1.49.1",
]
